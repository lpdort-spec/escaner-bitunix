name: Escaner Bitunix

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write             # para guardar seen.json y no repetir alertas

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Buscar rupturas
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./scanner.ps1 -Once -StateFile seen.json
      - name: Guardar estado
        run: |
          git config user.name "escaner"
          git config user.email "escaner@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "estado" && git pull --rebase -q && git push)
