name: Bot y escaner 24-7

on:
  schedule:
    - cron: "*/30 * * * *"     # asegura que siempre haya un turno en cola para el relevo
  workflow_dispatch:            # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write               # para guardar el estado y el registro de señales

concurrency:
  group: bot
  cancel-in-progress: false     # un turno a la vez; el siguiente espera en cola y relevo inmediato

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Bot de Telegram y escáner (turno de 5h45)
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./scanner.ps1 -MaxMinutes 345 -EverySeconds 120 -StateFile seen.json
      - name: Guardar estado
        if: always()
        shell: bash
        run: |
          git config user.name "escaner"
          git config user.email "escaner@users.noreply.github.com"
          for f in seen.json signals.jsonl last-report.txt bot-offset.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "estado" && git pull --rebase -q && git push)
